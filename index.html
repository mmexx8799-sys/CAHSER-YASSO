<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="تطبيق نقطة بيع سحابي متكامل للمحلات التجارية. إدارة مبيعات، مرتجعات، عملاء، وتقارير دقيقة. يعمل دون اتصال." />
    <title>نقطة بيع للملابس</title>
    
    <!-- Performance Optimizations: single font (Cairo 400/700 only), preload with fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"></noscript>
    
    <style>
      /* Critical CSS for Initial Loader */
      body {
        font-family: 'Cairo', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        margin: 0;
        background-color: #f3f4f6;

        /* NATIVE APP FEEL CSS */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      
      /* Allow text selection in inputs only */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      #root:empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      .critical-loader {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb; 
        border-bottom-color: #2563eb; 
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
</head>
  <body>
    <div id="root">
      <div class="critical-loader"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
