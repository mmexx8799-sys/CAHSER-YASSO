# 2.3 — CI: lint + typecheck + build + الـ 340 اختبارًا على كل PR.
# نشر الـ rules للإنتاج فقط بعد الدمج في master + موافقة (environment).
#
# خطوات يدوية لمرة واحدة (لا تُنفَّذ من الكود):
#  1) Settings → Branches → Add rule لـ master: Require status checks
#     (checks, tests) + Require pull request before merging.
#  2) Settings → Environments → New environment باسم production →
#     Required reviewers: (حسابك) — هذه هي "الموافقة" قبل نشر الـ rules.
#  3) إنشاء Service Account (Firebase Console → Project Settings →
#     Service Accounts → Generate New Private Key) بدور
#     "Firebase Rules Admin" + "Firebase Viewer"، ثم
#     Settings → Secrets → New repository secret باسم
#     FIREBASE_SERVICE_ACCOUNT يحمل محتوى ملف JSON كاملًا.
#     (المفتاح لا يُحفَظ في الكود إطلاقًا — راجع بند 1.3.)
# ملاحظة: وظيفة النشر تتخطى نفسها (Skipped) حتى تضيف السر في الخطوة 3 —
# هذا مقصود حتى لا تحمر على الفرع الرئيسي قبل اكتمال الإعداد.

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  tests:
    name: emulator suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      # tests/setup.ts يربط singletons المحاكيات (8080/9099) — بلا أي
      # بيانات اعتماد أو اتصال بالإنتاج.
      - run: npm run test:rules

  changes:
    name: detect rules changes
    # يعمل فقط على دفع master — على الـ PR يظهر Skipped بلا أي عمل.
    # بلا environment هنا عمدًا: لا موافقة تُطلب لهذه الوظيفة أبدًا.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.detect.outputs.rules }}
    steps:
      - uses: actions/checkout@v5
        with:
          # سجل كامل حتى يكون commit الدفع السابق (before) موجودًا محليًا للمقارنة.
          fetch-depth: 0
      - id: detect
        name: git diff — did firestore.rules or firestore.indexes.json change?
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" -- firestore.rules firestore.indexes.json | grep -q .; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-rules:
    name: deploy firestore.rules (production, approval-gated)
    needs: [checks, tests, changes]
    # يعمل فقط على دفع master AND عند تغير ملفات القواعد فقط — وإلا يظهر
    # Skipped بلا طلب موافقة (بوابة الـ environment لا تُقيَّم أصلًا لوظيفة لم تبدأ).
    # ملاحظة: سياق secrets ممنوع في
    # شرط الـ job نفسه (يفسد ملف الـ workflow كله — راجع
    # fix: move secrets check from job-level if to step-level)،
    # لذلك توفر السر يُفحص في أول step بالداخل.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: check
        name: check-secret — is FIREBASE_SERVICE_ACCOUNT configured?
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm install -g firebase-tools
        if: steps.check.outputs.configured == 'true'
      # كتابة المفتاح والنشر في step واحدة: المسار يُحسب مرة واحدة
      # عبر shell ($HOME) — لا تستخدم ${{ env.HOME }} هنا لأن env
      # context لا يرى متغيرات نظام الـ runner فيكون المسار فارغًا
      # (/firebase-sa.json) ويفشل التوثيق. لا يطبع السر في اللوج.
      - name: Write credentials and deploy rules
        if: steps.check.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-sa.json"
          firebase deploy --only firestore:rules --project casher-yasoo --non-interactive
